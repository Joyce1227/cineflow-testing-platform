name: cineflow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cineflow_db
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - movie_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/cineflow_db?charset=utf8mb4
      JWT_SECRET: docker-development-secret-change-before-production
      AUTO_CREATE_TABLES: "true"
      SEED_DEMO_DATA: "true"
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  movie_mysql_data:

name: CineFlow Quality Gates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-tests-and-coverage:
    name: API tests and coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CineFlowAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CineFlowAPI/requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run tests with branch coverage gate
        run: >-
          python -m pytest
          --cov=app
          --cov-config=.coveragerc
          --cov-report=term-missing
          --cov-report=xml:reports/coverage.xml
          --cov-fail-under=80
          --junitxml=reports/junit.xml
      - name: Upload API quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-quality-reports
          path: CineFlowAPI/reports

  security-automation:
    name: Security automation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CineFlowAPI
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CineFlowAPI/requirements-dev.txt
      - name: Install application and security tools
        run: python -m pip install -r requirements-dev.txt bandit pip-audit
      - name: Prepare report directory
        run: mkdir -p reports
      - name: Run authentication, RBAC and IDOR tests
        run: python -m pytest -m security --junitxml=reports/security-junit.xml
      - name: Scan Python source
        run: bandit -q -r app
      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt
      - name: Upload security test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: CineFlowAPI/reports/security-junit.xml

  ai-quality:
    name: Offline AI quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CineFlowAutoTest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CineFlowAutoTest/requirements.txt
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt
      - name: Run deterministic LLM, RAG and Agent gates
        run: >-
          python -m pytest
          tests/test_llm_client.py
          tests/test_llm_validation_pipeline.py
          tests/test_rag_quality.py
          tests/test_agent_quality.py
          -q

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: CineFlowWeb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: CineFlowWeb/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Publish deployable frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: cineflow-web-dist
          path: CineFlowWeb/dist

  integration-tests:
    name: MySQL integration and concurrency tests
    needs: [api-tests-and-coverage, security-automation, ai-quality, frontend-build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: CineFlowAutoTest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run the production-like test stack
        run: docker compose up --build --abort-on-container-exit --exit-code-from tests tests
      - name: Print container diagnostics on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=300 mysql api tests
      - name: Upload Allure and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: CineFlowAutoTest/reports
      - name: Stop services
        if: always()
        run: docker compose down -v

  publish-api-image:
    name: Publish API delivery image
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: integration-tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=long
      - name: Build and publish verified API image
        uses: docker/build-push-action@v6
        with:
          context: CineFlowAPI
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

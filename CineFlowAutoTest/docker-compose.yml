services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: cineflow_test
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3307:3306"

  api:
    build: ../CineFlowAPI
    environment:
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/cineflow_test?charset=utf8mb4
      JWT_SECRET: cineflow-ci-only-secret-at-least-32-chars
      AUTO_CREATE_TABLES: "true"
      SEED_DEMO_DATA: "true"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    ports:
      - "8000:8000"

  tests:
    build:
      context: ..
      dockerfile: CineFlowAutoTest/Dockerfile
    environment:
      BASE_URL: http://api:8000
      DATABASE_URL: mysql+pymysql://root:root@mysql:3306/cineflow_test?charset=utf8mb4
      WAIT_TIMEOUT: "120"
    depends_on:
      api:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/wait_for_api.py && pytest --junitxml=reports/junit.xml"]
    volumes:
      - ./reports:/workspace/CineFlowAutoTest/reports


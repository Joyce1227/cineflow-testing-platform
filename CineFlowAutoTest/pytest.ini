[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: core smoke tests
    regression: regression tests
    serial: stateful tests that should not run in parallel
    mysql: tests requiring a MySQL backend
    live_llm: tests that call a paid external LLM and require explicit opt-in


[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra --strict-markers --alluredir=reports/allure-results --clean-alluredir
markers =
    smoke: fast browser smoke tests
    regression: web regression tests
    e2e: end-to-end browser flows
    serial: stateful tests that must not run in parallel

